services:
  # 1. Backend Ingestion API + Socket.IO + Change Streams
  - type: web
    name: continuum-api
    env: node
    plan: free
    branch: main
    buildCommand: npm install && npm run build:intelligence && npm run build:api
    startCommand: npm run start:api
    envVars:
      - key: NODE_VERSION
        value: 20.12.0
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        value: "*"
      - key: MONGODB_URI
        sync: false

  # 2. Frontend React + Vite Dashboard
  - type: web
    name: continuum-dashboard
    env: static
    plan: free
    branch: main
    rootDir: packages/dashboard
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: continuum-api
          property: host
      - key: VITE_SOCKET_URL
        fromService:
          type: web
          name: continuum-api
          property: host
